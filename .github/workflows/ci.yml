name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "windows-latest"]
        python-version: ["3.12", "3.13"]
    env:
      P24_MODE: demo
      PYTHONUTF8: "1"
      DJANGO_DEBUG: "true"
      DB_HOST: ""
      P24_ACCESS_KEY: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check Django and migration state
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Check Python code
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests
        run: python -m pytest -q

      - name: Check browser-side scripts
        run: |
          node --check apps/portal/assets/pilot.js
          node scripts/test_pilot_ui.cjs
          node scripts/test_console_state.cjs

      - name: Five-browser HTTP regression (synthetic only)
        run: python scripts/test_lan_http.py
