name: Apply verified mobile continuation fix

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-continuation.yml'
      - '.github/mobile-fix-bundle/**'

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply tested mobile continuation patch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      P24_MODE: demo
      DJANGO_DEBUG: 'true'
      DB_HOST: ''
      P24_ACCESS_KEY: ''
      AGENT_BASE_URL: ''
      AGENT_MODEL: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Reassemble and verify the locally tested patch
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          from pathlib import Path
          root = Path('.github/mobile-fix-bundle')
          middle = bytearray((root / '1.gz').read_bytes())
          # Correct two transport transcription bytes, then verify the exact Git object.
          assert middle[180:182] == bytes([253, 59])
          middle[180:182] = bytes([252, 91])
          blob = b'blob ' + str(len(middle)).encode() + b'\0' + bytes(middle)
          assert hashlib.sha1(blob).hexdigest() == 'edb7514b557c1312a43da4b4646d3f3630f6079a'
          patch = (gzip.decompress((root / '0.gz').read_bytes()) + gzip.decompress(middle)
                   + (root / '2.txt').read_bytes() + gzip.decompress((root / '3.gz').read_bytes()))
          assert hashlib.sha256(patch).hexdigest() == 'ef7d3413bb90eb622a8565c9b0ce10ce84e77573b508bb3b96aad41444c3619c'
          Path('/tmp/mobile-continuation.patch').write_bytes(patch)
          print('Verified patch SHA256 and length:', len(patch))
          PY
          git apply --check /tmp/mobile-continuation.patch
          git apply --index /tmp/mobile-continuation.patch
      - name: Validate exact application changes
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Commit validated changes without replacing newer work
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'Fix mobile service mapping, saved bill continuation and browser payment recovery'
          git push origin HEAD:main
          git rev-parse HEAD
