name: Apply verified checkout interface

on:
  push:
    paths:
      - '.checkout-delivery/**'
      - '.github/workflows/apply-checkout-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      P24_MODE: demo
      DB_HOST: ''
      P24_ACCESS_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Verify and apply exact tested patch
        run: |
          test "$(git rev-parse HEAD^)" = '55dd769e7a2174a2ed70f8109697f935a8320876'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.checkout-delivery/{i}.b64').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '998de3728929916824f88a7dabdeb63b6cea3ba2373922c6954d4449d1260d61'
          Path('/tmp/checkout.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/checkout.patch
          git apply --index --unidiff-zero /tmp/checkout.patch
          cp .git/index /tmp/checkout-source-index
          GIT_INDEX_FILE=/tmp/checkout-source-index git rm --cached -r -- .checkout-delivery .github/workflows/apply-checkout-ui.yml
          test "$(GIT_INDEX_FILE=/tmp/checkout-source-index git write-tree)" = 'd69c79a29ff9ed6ee5bd3ea5260b710e641deb55'
      - name: Validate before publishing
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
          node scripts/test_pilot_ui.cjs
          node scripts/test_console_state.cjs
          python scripts/test_lan_http.py
      - name: Publish tested source without changing workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve checkout cards, automatic IPG links, account UX and shared 50-turn quota'
          git push origin HEAD:main
